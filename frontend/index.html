<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDN Blockchain Transactions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #f5f5f5; padding: 15px; border-radius: 8px; flex: 1; }
        .transactions { margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .loading { text-align: center; color: #666; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h1>EDN Blockchain Transaction Dashboard</h1>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Total Transactions</h3>
                <p id="totalTx">Loading...</p>
            </div>
            <div class="stat-card">
                <h3>Recent Activity</h3>
                <p id="recentCount">Loading...</p>
            </div>
            <div class="stat-card">
                <h3>Last Updated</h3>
                <p id="lastUpdated">Loading...</p>
            </div>
        </div>
        
        <div class="transactions">
            <h2>Recent Transactions</h2>
            <div id="loading" class="loading">Loading transactions...</div>
            <div id="error" class="error" style="display: none;"></div>
            <table id="txTable" style="display: none;">
                <thead>
                    <tr>
                        <th>UUID</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Empresa ID</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Blockchain ID</th>
                    </tr>
                </thead>
                <tbody id="txBody"></tbody>
            </table>
        </div>
        
        <button onclick="refreshData()">Refresh</button>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        
        async function fetchData() {
            try {
                const [statsRes, txRes] = await Promise.all([
                    fetch(`${API_BASE}/analytics/overview`),
                    fetch(`${API_BASE}/transactions/recent?limit=10`)
                ]);
                
                if (!statsRes.ok || !txRes.ok) throw new Error('API error');
                
                const stats = await statsRes.json();
                const txData = await txRes.json();
                
                updateStats(stats.data);
                updateTransactions(txData.data);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('txTable').style.display = 'table';
                document.getElementById('error').style.display = 'none';
                
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = `Error: ${error.message}`;
                document.getElementById('error').style.display = 'block';
                document.getElementById('txTable').style.display = 'none';
            }
        }
        
        function updateStats(stats) {
            document.getElementById('totalTx').textContent = stats.totalTransactions || 0;
            document.getElementById('recentCount').textContent = stats.recentTransactions || 0;
            document.getElementById('lastUpdated').textContent = stats.lastUpdated || new Date().toLocaleString();
        }
        
        function updateTransactions(transactions) {
            const tbody = document.getElementById('txBody');
            tbody.innerHTML = '';
            
            transactions.forEach(tx => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${tx.uuid.substring(0, 8)}...</td>
                    <td>${tx.transactionType}</td>
                    <td>$${tx.amount.toFixed(2)}</td>
                    <td>${tx.empresaId}</td>
                    <td>${tx.status}</td>
                    <td>${new Date(tx.createdAt).toLocaleString()}</td>
                    <td>${tx.blockchainId || 'N/A'}</td>
                `;
            });
        }
        
        function refreshData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('txTable').style.display = 'none';
            fetchData();
        }
        
        // Initial load and auto-refresh every 30 seconds
        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
